# Learner skills for this book: see tools/author-tools/skills.js.
# Each skill's id is also the class that tags the paragraph teaching it,
# as in ::: {.tty}. Make new ids with: node tools/new-skill-id.mjs js [count]
# The order here is the order of lines in the profile.

intro: I'm a beginner learning JavaScript from a textbook, and I'd like your help learning it.
noConceptsYet: I don't know any programming concepts yet.
rulesHeading: 'When you write code for me:'
knowsHeading: 'What I know so far:'
knowsNone: 'What I know so far: nothing yet.'

skills:

  # ai-assistant
  - id: tty
    type: environment
    text: I'm running JavaScript in an online editor that shows console.log output.
  - id: w0l
    type: rule
    text: Use only the concepts listed below under "What I know so far." If a task needs something I haven't learned, tell me what it is instead of using it.
  - id: bcy
    type: rule
    text: Don't use semicolons at the ends of lines.
  - id: lah
    type: rule
    text: Keep the code short and simple, and explain what each line does in plain language.

  # first-code
  - id: gxs
    text: statements and expressions
  - id: viw
    text: console.log to display values, including several values separated by commas
  - id: ime
    text: text in quote marks
  - id: yrx
    text: joining strings with +
  - id: bkj
    text: numbers and the arithmetic operators + - * /
  - id: bhs
    text: comments that start with //
  - id: e07
    text: giving a value a name with let, for example let student = "Ava"
  - id: zf5
    text: reading error messages

  # apps-script
  - id: nux
    type: environment
    text: I'm writing Google Apps Script in the Apps Script editor attached to a Google Sheet.
  - id: d18
    type: rule
    text: Put all the code in one function with a descriptive name. Don't create extra functions or use parameters.
  - id: f6f
    text: 'what a function is: a named group of steps written as function name() { }'
  - id: jnz
    text: choosing which function to run in the Apps Script editor
  - id: bxj
    text: reading output in the Execution log
  - id: fv7
    text: methods, used with a dot, such as SpreadsheetApp.getActiveSheet().getRange("A1").setValue("Hello") to write into a cell

  # variables
  - id: hd5
    type: rule
    text: Use let for every variable. Don't use var or const.
  - id: tjp
    type: rule
    text: Write each step on its own line, and store each result in a variable. Don't chain method calls together.
  - id: qbh
    text: changing a variable's value with =, as in count = count + 1
  - id: ars
    text: strings, numbers and booleans (true and false), and checking a value's type with typeof
  - id: yc6
    text: reading a cell with getValue(), and storing a sheet or a range in a variable
  - id: ver
    text: empty cells read as an empty string ""
  - id: jfd
    text: converting with Number() and String(), and what NaN means
  - id: dj9
    text: 'template literals: text between backticks, with ${ } to insert a value'

  # decisions
  - id: r8u
    type: rule
    text: Compare values with === and !==. Don't use == or !=.
    with: n8s
  - id: w5b
    text: if, else if and else, including an if inside another if's block
  - id: n8s
    text: the comparison operators === !== > < >= <=
  - id: svn
    text: the logical operators && (and), || (or) and ! (not)
  - id: q81
    text: checking for an empty cell with === "" before converting a value

  # arrays
  - id: mgs
    text: 'arrays: square brackets, indexes starting at 0, length, push, and changing an item by its index'
  - id: yas
    text: arrays of arrays, read as data[row][column]
  - id: qov
    text: reading a range with getValues() and writing one with setValues(), and getDataRange()
  - id: uz7
    text: getting a sheet by name with SpreadsheetApp.getActiveSpreadsheet().getSheetByName()
  - id: wko
    text: Logger.log, which works like console.log in Apps Script

  # loops
  - id: m95
    type: rule
    text: Use for loops with an index, such as for (let i = 0; i < data.length; i++). Don't use forEach or for...of.
  - id: tew
    text: while loops and for loops
  - id: f5k
    text: the ++, -- and += shortcuts
  - id: rd2
    text: 'running totals: a variable that starts at 0 before a loop and is added to inside it'
  - id: yf3
    text: looping over the rows from getValues(), starting at 1 to skip a header row
  - id: siy
    text: infinite loops, and why they happen

  # functions
  - id: pmf
    type: rule
    text: Use const for a variable whose value never changes, and let for one that does. Don't use var.
    replaces: [hd5]
    with: z4m
  - id: z3e
    type: rule
    text: Put the steps for each task in a function with no parameters and a descriptive name, so I can run it from the Apps Script editor. That function can call other functions.
    replaces: [d18]
    with: i5d
  - id: lhl
    text: functions with parameters, called with arguments
  - id: sq7
    text: return, to send a value back from a function
  - id: i5d
    text: calling one function from another
  - id: z4m
    text: const, and that an array created with const can still be changed with push

  # case
  - id: vv3
    text: rounding numbers with toFixed() and Math.round(), and that adding decimals can give results like 9.500000000000002

  # google-forms
  - id: zvv
    text: split(), to break text into an array at a separator
  - id: wn5
    text: getRange(row, column, numRows, numColumns), to get a range with numbers
  - id: bd5
    text: parallel arrays, and returning -1 from a search when nothing is found
  - id: m1k
    text: nested loops, using i for the outer loop and j for the inner one

  # objects
  - id: zar
    text: 'objects: properties in curly braces, read and changed with dot notation or bracket notation'
  - id: pfe
    text: a property that doesn't exist is undefined
  - id: qwp
    text: arrays of objects, such as turning the rows of a sheet into member objects
  - id: p5z
    text: counting by name with an object, and listing its keys with Object.keys()
  - id: zkh
    text: JSON, with JSON.stringify() and JSON.parse()
  - id: egx
    text: naming a fixed value in capitals, such as HOURS_COLUMN

  # triggers
  - id: gq0
    type: rule
    text: When code needs a trigger, tell me how to set it up in the Apps Script editor, and how to test it without waiting for the event.
    with: r3p
  - id: odi
    text: simple triggers (onOpen, onEdit) and installable triggers (on form submit, time-driven)
  - id: cny
    text: custom menus with SpreadsheetApp.getUi(), createMenu(), addItem() and addToUi()
  - id: pus
    text: the event object e, including e.namedValues for a form submission
  - id: r3p
    text: testing a trigger function by calling it with a made-up event object
  - id: yq9
    text: checking the Executions page when automatic code fails
  - id: txf
    text: adding a row with appendRow()

  # email-calendar
  - id: dnf
    type: rule
    text: Before code sends email or changes a calendar, have it log what it would do (a dry run), unless I ask for the real thing.
    with: xf6
  - id: b2x
    text: sending email with MailApp.sendEmail(), and that GmailApp asks for full access to Gmail
  - id: w11
    text: \n for a line break in a string
  - id: sgy
    text: 'the Date object: new Date(), new Date(year, month, day, hour, minute) with months counting from 0, getFullYear, getMonth, getDate, getDay, and adding days with setDate'
  - id: l8v
    text: formatting a date as text with Utilities.formatDate()
  - id: phr
    text: creating events with CalendarApp
  - id: xf6
    text: dry runs that log instead of acting

  # documents
  - id: xzi
    type: rule
    text: Before code sends email, changes a calendar, or creates, changes or deletes files in Google Drive, have it log what it would do (a dry run) or test it on one item, unless I ask for the real thing.
    replaces:
      - dnf
  - id: i7b
    text: 'DriveApp: getFileById, getFolderById, makeCopy, createFile and setTrashed, and finding a file''s ID in its web address'
  - id: len
    text: 'DocumentApp: create, openById, getBody, replaceText, appendParagraph, setHeading, appendTable and saveAndClose'
  - id: cqc
    text: saving a document as a PDF with getAs("application/pdf")
  - id: k74
    text: constants declared at the top of the file, outside any function, for settings such as IDs
  - id: ajf
    text: keeping calculations in their own functions so they can be tested without creating anything

  # custom-functions
  - id: ogw
    text: custom functions typed into a cell like a formula, which receive a range argument as an array of arrays and return a value to the cell
  - id: qzi
    text: that Sheets recalculates a custom function only when its arguments change, so data it uses should be passed in as a range
  - id: lm7
    text: 'what custom functions can''t do: anything that needs permission, or changing other cells'
  - id: tkt
    text: the /** ... */ comment with @param and @customfunction

  # web-services
  - id: vkq
    type: rule
    text: Keep secrets such as webhook addresses and API keys out of the code. Store them in Script Properties.
    with: uxn
  - id: myf
    text: web APIs, query strings, and reading JSON replies
  - id: bzk
    text: UrlFetchApp.fetch() and getContentText(), including posting JSON with an options object
  - id: fzq
    text: try and catch, and throw to raise an error again so a failure isn't hidden
  - id: dd0
    text: incoming webhooks
  - id: uxn
    text: PropertiesService.getScriptProperties() for storing secrets
  - id: c0p
    text: strings in single quotes, useful when the text contains double quotes

  # web-app
  - id: c1x
    type: rule
    text: When code creates a web page that other people can open, tell me who will be able to see it and what data it shows.
    with: auv
  - id: byy
    text: 'basic HTML: tags such as h1, p, strong, table, tr, th and td, and attributes'
  - id: szj
    text: 'web apps in Apps Script: doGet and HtmlService.createHtmlOutput()'
  - id: auv
    text: deploying a web app, choosing who can open it, test deployments, and making a new version after changing the code
  - id: x9c
    text: using an object as a lookup table, such as bed names by bed ID
  - id: b2f
    text: text inserted into HTML is read as HTML

  # web-pages
  - id: f1h
    type: environment
    text: I'm writing web pages with HTML, CSS and JavaScript, and opening them in my web browser.
  - id: fb8
    type: rule
    text: Don't use semicolons at the ends of lines in JavaScript. CSS still needs a semicolon after each property.
    with: jj5
    replaces:
      - bcy
  - id: sf6
    type: rule
    text: When I'm working in Apps Script, put the steps for each task in a function with no parameters that I can run from the editor, and when code needs a trigger, tell me how to set it up and test it.
    replaces: [z3e, gq0]
  - id: d3z
    type: rule
    text: Keep secrets such as webhook addresses and API keys out of the code. In Apps Script, store them in Script Properties. In a web page, remember that anyone who opens the page can read its code.
    replaces: [vkq]
  - id: rj5
    text: 'the structure of an HTML page: doctype, html, head, title and body'
  - id: cb0
    text: 'more HTML: h2, ul, ol, li, a with href, img with src and alt, div and span, and the id and class attributes'
  - id: jj5
    text: 'CSS in a style tag: selectors for tags, classes (.name) and ids (#name), and properties such as color, font-family, margin, padding and border'
  - id: evj
    text: 'the DOM, and changing a page with a script tag at the end of the body: document.querySelector(), textContent and innerHTML'
  - id: d30
    text: opening a page's developer tools (F12) to see the Console and the Elements panel

  # events
  - id: ou4
    text: events and addEventListener, with click and input events
  - id: v5o
    text: 'passing a function as a value, without parentheses, and anonymous functions written in place: function() { }'
  - id: lqj
    text: 'form inputs: input with type text or number, label, and reading value (always a string)'
  - id: r78
    text: 'validating input: empty fields, isNaN, and values that make no sense for the problem'
  - id: ixw
    text: Math.floor and Math.ceil

  # async
  - id: dtv
    text: synchronous and asynchronous code, and why the browser doesn't wait
  - id: wmk
    text: promises, async functions and await, and recognizing .then() in other code
  - id: zu2
    text: fetch() and await response.json(), checking response.ok, and throw new Error()
  - id: jhm
    text: document.createElement(), appendChild() and className
  - id: yft
    text: CORS, and why some APIs can't be fetched from a web page

  # automating-pages
  - id: cks
    type: rule
    text: When code runs on a website I don't own, remind me to check the site's terms of use, and keep it to what I could do by hand in my own account.
    with: n0t
  - id: hbw
    text: document.querySelectorAll(), and calling querySelector or querySelectorAll on an element to search inside it
  - id: n0t
    text: running code in the developer tools' Console and Snippets
  - id: wrl
    text: 'bookmarklets: javascript: addresses, (function() { ... })() to keep variables private, and that one-line code needs semicolons and no // comments'
  - id: om0
    text: 'userscripts with Tampermonkey: the metadata block, @match and @run-at'
  - id: plz
    text: setting an input's value from code
  - id: tbv
    text: making a file to download with Blob, URL.createObjectURL() and a link with a download attribute
  - id: nzs
    text: CSV files, and quoting values that contain commas

  # extension
  - id: h4i
    type: rule
    text: When a page sends data that will be stored, check the data where it's stored, not only in the page.
    with: wyv
  - id: dkv
    text: 'Manifest V3 browser extensions: manifest.json, a popup page, host_permissions, loading an unpacked extension, and that JavaScript must be in separate .js files'
  - id: wyv
    text: doPost(e), e.postData.contents, and replying with ContentService.createTextOutput()
  - id: hy5
    text: 'fetch with method: "POST" and a body'
  - id: mxk
    text: reading both halves of a system together, and passing errors back to the person

  # publishing
  - id: czb
    text: 'a website as a folder: index.html, and CSS and JavaScript in their own files with link rel="stylesheet" and script src'
  - id: o6c
    text: relative and absolute paths, and that file names on web servers are case-sensitive
  - id: q2r
    text: publishing a static site for free, such as with Cloudflare's direct upload, and updating it
  - id: abj
    text: the Network panel in the developer tools, and 404 errors
  - id: zie
    text: that everything in a published site's folder is public, including its code

  # jade
  - id: ri9
    type: environment
    text: I'm writing JavaScript for Microsoft Excel, using the Office JavaScript API (Office.js) in a free Excel add-in called JADE.
  - id: g12
    text: 'Office.js in JADE: async function name(excel), where excel is the request context'
  - id: h8g
    text: excel.workbook.worksheets.getItem(), worksheets.add(), getRange(), getUsedRange(), and a range's values and numberFormat (arrays of arrays)
  - id: jmz
    text: load() before reading a property, and await excel.sync() to send queued requests to Excel
  - id: r81
    text: Jade.print(text, heading) and Jade.open_output()
  - id: lda
    text: reading arrow functions, such as (context) => { }

  # platform-profile
  - id: mf6
    type: rule
    text: When you're not sure how a tool or platform works, say so instead of guessing.
  - id: mp7
    text: recognizing Office.js, Office Scripts, VBA and Apps Script code
  - id: xgw
    text: platform profiles, such as my JADE platform profile
  - id: rmh
    text: 'JADE canvases: Jade.open_canvas(), tag(), and button handlers wrapped in Jade.automate()'
  - id: trm
    text: the Jade.listing comment
  - id: fzp
    text: a range's format.fill.color, and getRangeByIndexes() in Office.js

  # excel-app
  - id: bbt
    text: select and option elements for drop-down lists
  - id: j3b
    text: auto_exec in JADE, and Jade.open_automations()
  - id: rcn
    text: storing settings with await Jade.save_object_to_workbook() and await Jade.read_object_from_workbook(), which returns {} when nothing is saved
  - id: wxs
    text: 'JADE themes: the fourth argument to Jade.open_canvas(), Jade.set_theme() and Jade.list_themes()'
  - id: wgg
    text: redrawing a panel by calling the function that builds it again
  - id: t6w
    text: loading only the properties you need, such as rowCount

  # sharing-code
  - id: zpo
    type: rule
    text: Before code loads code or a library from the internet, tell me where it comes from, and use an address with the version in it.
    with: twd
  - id: jvn
    text: jade_modules, for calling functions in another code module
  - id: wls
    text: GitHub gists, and the difference between Jade.load_gist (loads the latest version each time) and Jade.import_code_module (copies it once)
  - id: twd
    text: loading libraries with await Jade.load_js(url, null), and pinning their versions
  - id: iun
    text: drawing a chart with Chart.js on a canvas element
  - id: jqu
    text: deciding whether to trust code from elsewhere before it runs

  # office-scripts
  - id: aqa
    text: 'Office Scripts: function main(workbook: ExcelScript.Workbook), getWorksheet, getUsedRange, getValues, setValue and setValues, and that it has no load or sync'
  - id: sim
    text: 'reading TypeScript: type annotations such as count: number, and that "as number" doesn''t convert a value'
  - id: dcg
    text: that Power Automate can run Office Scripts on a schedule
  - id: kjl
    text: recognizing VBA

  # airtable
  - id: gx1
    type: environment
    text: I'm writing JavaScript in Airtable's Scripting extension, in my own Airtable base.
